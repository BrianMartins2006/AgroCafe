<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redefinir Senha | Fazenda Porteira Azul ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        height: 100vh;
        background: url('/static/tela_em_branco.jpg') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-card {
        border-radius: 20px;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        width: 100%;
        max-width: 400px;
      }
      .logo-text { font-size: 1.5rem; font-weight: 700; color: darkblue; }
      .btn-primary { background-color: darkblue; border: none; border-radius: 12px; font-weight: 500; }
      .btn-primary:hover { background-color: hsl(205, 100%, 30%); }
      .form-control { border-radius: 12px; }
    </style>
  </head>
  <body>
    <div class="app-card text-center">
      <div class="mb-4">
        <div class="logo-text">Nova Senha</div>
        <p class="text-muted mt-2">Escolha uma nova senha para sua conta</p>
      </div>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show text-start" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3 text-start">
          <label class="form-label">Nova Senha</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Confirmar Nova Senha</label>
          <input type="password" class="form-control" name="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mb-2 text-white">Salvar e Entrar</button>
      </form>
    </div>
  </body>
</html>
